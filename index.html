<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi cậu 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe6eb 0%, #ffb6c1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* --- Hiệu ứng Hoa rơi --- */
        .flower {
            position: absolute;
            top: -20px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* --- Khung Phong Bì --- */
        .container {
            position: relative;
            cursor: pointer;
        }

        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #f08080;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        /* Nắp phong bì */
        .envelope-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            z-index: 4;
            border-top: 110px solid #f49797;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            transform-origin: top;
            transition: transform 0.6s ease-in-out 0.4s, z-index 0.2s ease-in-out 0.4s;
        }

        /* Mặt trước phong bì */
        .envelope-wrapper::after {
            content: '';
            position: absolute;
            z-index: 3;
            border-left: 150px solid #f49797;
            border-right: 150px solid #f49797;
            border-bottom: 100px solid #e57373;
            border-top: 100px solid transparent;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        /* --- Lá thư bên trong --- */
        .letter {
            position: absolute;
            right: 20px;
            bottom: 0;
            width: 260px;
            height: 180px;
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: all 0.6s ease-in-out;
            z-index: 2;
            overflow: hidden;
            text-align: center;
        }

        .letter h2 {
            font-size: 16px;
            color: #d81b60;
            margin-bottom: 10px;
        }

        .letter p {
            font-size: 13px;
            color: #444;
            line-height: 1.5;
            text-align: justify;
        }

        .letter .signature {
            margin-top: 10px;
            text-align: right;
            font-weight: bold;
            color: #ad1457;
            font-style: italic;
        }

        /* Trái tim phong bì */
        .heart {
            position: absolute;
            top: 85px;
            left: 50%;
            width: 30px;
            height: 30px;
            background: #e91e63;
            z-index: 5;
            transform: translate(-50%, -50%) rotate(45deg);
            transition: transform 0.4s ease-in-out 0.2s, opacity 0.4s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .heart::before, .heart::after {
            content: '';
            width: 30px;
            height: 30px;
            background: #e91e63;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before { top: -15px; left: 0; }
        .heart::after { left: -15px; top: 0; }

        /* Chữ hướng dẫn */
        .click-hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #d81b60;
            font-weight: bold;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* --- Xử lý khi Bấm mở phong bì --- */
        .container.open .envelope-wrapper::before {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .container.open .letter {
            height: 300px;
            transform: translateY(-120px);
            z-index: 5;
            overflow-y: auto;
        }

        .container.open .heart {
            opacity: 0;
        }

        .container.open .click-hint {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="envelopeContainer">
        <div class="envelope-wrapper">
            <div class="letter">
                <h2>💖 Gửi Phương nhó 💖</h2>
                <p>
                    Biết cậu lâu quá chừng nhưng mà chưa có làm quenn nhiều. 
                    Lần đầu viết thư tình nên là cũng hong biết nói gì lém. 
                    Mong rằng mình sẽ cùng nhau chia sẻ thêm thật nhiều niềm vui và hạnh phúc phía trước nhó
                </p>
                <div class="signature">T-Vũ 💕</div>
            </div>
            <div class="heart"></div>
        </div>
        <div class="click-hint">✨ Nhấn vào phong bì để mở thư ✨</div>
    </div>

    <script>
        // Mở / Đóng phong bì khi click
        const container = document.getElementById('envelopeContainer');
        container.addEventListener('click', () => {
            container.classList.toggle('open');
        });

        // Tạo hiệu ứng Hoa rơi
        const flowers = ['🌸', '🌹', '🌺', '💖', '✨'];
        function createFlower() {
            const flower = document.createElement('div');
            flower.classList.add('flower');
            flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = Math.random() * 3 + 2 + 's'; // 2s - 5s
            flower.style.fontSize = Math.random() * 10 + 15 + 'px'; // 15px - 25px
            
            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, 5000);
        }

        setInterval(createFlower, 300);
    </script>
</body>
</html>
